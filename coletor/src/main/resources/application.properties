spring.application.name=coletor
# .env (na raiz ou na pasta atual) + configuração de banco compartilhada (módulo compartilhado)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],classpath:banco.properties

# Open-Meteo (Forecast API, sem chave de API)
openmeteo.url=https://api.open-meteo.com/v1/forecast
# Coordenadas da localização escolhida pelo grupo (padrão: São Paulo/SP)
openmeteo.latitude=${OPENMETEO_LATITUDE:-23.5505}
openmeteo.longitude=${OPENMETEO_LONGITUDE:-46.6333}
openmeteo.timezone=America/Sao_Paulo
openmeteo.timeout-segundos=10

# Intervalo entre coletas: 15 min. É uma escolha para não consultar a fonte em uma
# frequência maior que a janela de 900 s informada em `current.interval`.
# Para uma demonstração que exija literalmente o intervalo de 10 s
# do enunciado, defina COLETA_INTERVALO_MS=10000 no ambiente.
coleta.intervalo-ms=${COLETA_INTERVALO_MS:900000}

# Carga inicial para popular gráficos e tabela sem manter o computador ligado por dias.
# A API é consultada uma vez na inicialização e a previsão é renovada a cada 6 horas.
sincronizacao.historico-dias=${HISTORICO_DIAS:15}
sincronizacao.previsao-dias=${PREVISAO_DIAS:7}
sincronizacao.intervalo-ms=${SINCRONIZACAO_INTERVALO_MS:21600000}
