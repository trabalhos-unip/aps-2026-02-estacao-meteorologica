name: Deploy na Oracle

on:
  push:
    branches:
      - feature/probabilidade-chuva-horaria
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Impede dois pushes de compilarem simultaneamente na VM pequena.
concurrency:
  group: deploy-oracle-producao
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.paths.outputs.webapp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            webapp:
              - 'webapp/**'
              - 'compartilhado/**'
              - 'pom.xml'
              - 'deploy/oracle/Dockerfile.webapp'

  build-webapp:
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no registro de imagens do GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar e publicar imagem pronta da webapp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/oracle/Dockerfile.webapp
          push: true
          tags: ghcr.io/trabalhos-unip/meteora-webapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Permitir download da imagem pela VM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          /orgs/trabalhos-unip/packages/container/meteora-webapp
          -f visibility=public

  deploy:
    needs: [changes, build-webapp]
    if: >-
      always() && vars.ORACLE_DEPLOY_ENABLED == 'true' &&
      (needs.build-webapp.result == 'success' || needs.build-webapp.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configurar chave SSH exclusiva do deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Atualizar aplicacao na VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_USER@$ORACLE_HOST"
