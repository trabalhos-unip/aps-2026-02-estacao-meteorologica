# Sobreposição para a VM Oracle Always Free VM.Standard.E2.1.Micro (1 GB RAM).
# Indicada para demonstração e uso acadêmico de baixo tráfego.
services:
  mysql:
    command:
      - --innodb-buffer-pool-size=96M
      # Webapp, collector e healthcheck precisam de uma pequena margem sem
      # deixar o MySQL consumir memoria demais na VM de 1 GB.
      - --max-connections=24
      - --performance-schema=OFF
    mem_limit: 220m

  webapp:
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -Dhibernate.connection.pool_size=8
    mem_limit: 360m

  collector:
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m -XX:MaxMetaspaceSize=96m -Dhibernate.connection.pool_size=4
    mem_limit: 260m

  caddy:
    mem_limit: 96m
