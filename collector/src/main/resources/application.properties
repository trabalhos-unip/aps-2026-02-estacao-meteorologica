spring.application.name=collector
# Lê o .env (na pasta atual ou na raiz do projeto) para as configurações abaixo.
# A conexão com o banco NÃO fica aqui: ela é feita pelo HibernateUtil + hibernate.cfg.xml (módulo compartilhado),
# que também lê usuário e senha do .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Open-Meteo (Forecast API, sem chave de API)
openmeteo.url=https://api.open-meteo.com/v1/forecast
# Coordenadas da localização escolhida pelo grupo (padrão: São Paulo/SP)
openmeteo.latitude=${OPENMETEO_LATITUDE:-23.5505}
openmeteo.longitude=${OPENMETEO_LONGITUDE:-46.6333}
openmeteo.timezone=America/Sao_Paulo
openmeteo.timeout-segundos=10

# Intervalo entre coletas (10 s, para fins de teste, conforme o enunciado).
# Atenção aos limites de uso da Open-Meteo: rode o coletor só em períodos controlados de teste.
coleta.intervalo-ms=${COLETA_INTERVALO_MS:10000}

# Logs do Hibernate só a partir de avisos
logging.level.org.hibernate=WARN
