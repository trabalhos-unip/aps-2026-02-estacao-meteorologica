spring.application.name=collector
# Lê o .env (na pasta atual ou na raiz do projeto) para as configurações abaixo.
# A conexão com o banco NÃO fica aqui: ela é feita pelo HibernateUtil + hibernate.cfg.xml (módulo compartilhado),
# que também lê usuário e senha do .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Open-Meteo (Forecast API, sem chave de API)
openmeteo.url=https://api.open-meteo.com/v1/forecast
# Coordenadas da localização escolhida pelo grupo (padrão: São Paulo/SP)
estacao.nome=${ESTACAO_NOME:Estacao Sorocaba}
estacao.cidade=${ESTACAO_CIDADE:Sorocaba}
openmeteo.latitude=${OPENMETEO_LATITUDE:-23.5015}
openmeteo.longitude=${OPENMETEO_LONGITUDE:-47.4526}
openmeteo.timezone=America/Sao_Paulo
openmeteo.timeout-segundos=10

# Intervalo entre coletas (10 s, para fins de teste, conforme o enunciado).
# Atenção aos limites de uso da Open-Meteo: rode o coletor só em períodos controlados de teste.
coleta.intervalo-ms=${COLETA_INTERVALO_MS:10000}
# Consulta o banco com frequência, mas chama a API somente se a estação mudou.
coleta.verificacao-estacao-ms=${COLETA_VERIFICACAO_ESTACAO_MS:1000}

# Modo de operação: REAL (consulta a Open-Meteo) ou SIMULADO (cenários de teste, sem internet).
coleta.modo=${COLETA_MODO:REAL}
# Só no modo SIMULADO: TEMPO_SECO, CHUVA_FORTE, VENTO_FORTE ou DADOS_INCOMPLETOS.
# Vazio = alterna entre todos os cenários a cada coleta.
coleta.cenario=${COLETA_CENARIO:}

# Carrega no banco 15 dias passados e 15 dias futuros, inclusive quando o coletor ficou desligado.
sincronizacao.historico-dias=${SINCRONIZACAO_HISTORICO_DIAS:15}
sincronizacao.previsao-dias=${SINCRONIZACAO_PREVISAO_DIAS:15}
sincronizacao.intervalo-ms=${SINCRONIZACAO_INTERVALO_MS:21600000}
# Detecta troca de cidade e sincroniza a nova estação sem aguardar as seis horas.
sincronizacao.verificacao-estacao-ms=${SINCRONIZACAO_VERIFICACAO_ESTACAO_MS:1000}

# Logs do Hibernate só a partir de avisos
logging.level.org.hibernate=WARN
