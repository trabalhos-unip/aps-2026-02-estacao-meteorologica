spring.application.name=webapp
# Lê o .env (na pasta atual ou na raiz do projeto) para as configurações abaixo.
# A conexão com o banco NÃO fica aqui: ela é feita pelo HibernateUtil + hibernate.cfg.xml (módulo compartilhado),
# que também lê usuário e senha do .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${SERVIDOR_PORTA:8080}

openmeteo.url=https://api.open-meteo.com/v1/forecast
estacao.nome=${ESTACAO_NOME:Estacao Sorocaba}
estacao.cidade=${ESTACAO_CIDADE:Sorocaba}
openmeteo.latitude=${OPENMETEO_LATITUDE:-23.5015}
openmeteo.longitude=${OPENMETEO_LONGITUDE:-47.4526}
openmeteo.timezone=${OPENMETEO_TIMEZONE:America/Sao_Paulo}

# Logs do Hibernate só a partir de avisos
logging.level.org.hibernate=WARN
