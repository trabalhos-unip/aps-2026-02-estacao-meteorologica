<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6fbff">
  <meta name="description" content="Meteora: painel da estação meteorológica da APS 2026/2.">
  <title>Meteora — Estação Meteorológica</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script>
    // Aplica o tema antes de desenhar a página, para não piscar o tema claro.
    try {
      const theme = JSON.parse(localStorage.getItem("meteora-ui-preferences") || "{}").theme;
      const dark = theme === "escuro" || (theme !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch { document.documentElement.dataset.theme = "light"; }
  </script>
  <link rel="stylesheet" href="/css/app.css?v=20261029-34">

  <link rel="stylesheet" href="/css/hourly-weather.css?v=20261029-8">
  <link rel="stylesheet" href="/css/dark-theme.css?v=20261029-3">
</head>
