spring.application.name=servidor-web
# .env (na raiz ou na pasta atual) + configuração de banco compartilhada (módulo compartilhado)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],classpath:banco.properties

server.port=${SERVIDOR_PORTA:8080}

# Durante o desenvolvimento, cada navegação deve carregar a versão atual da interface.
spring.web.resources.cache.cachecontrol.no-store=true

# Mesma consulta configurada para o coletor. A página usa esses dados apenas para
# montar o link de comparação com a resposta oficial da Open-Meteo.
openmeteo.url=https://api.open-meteo.com/v1/forecast
openmeteo.latitude=${OPENMETEO_LATITUDE:-23.5505}
openmeteo.longitude=${OPENMETEO_LONGITUDE:-46.6333}
openmeteo.timezone=America/Sao_Paulo
estacao.cidade=${ESTACAO_CIDADE:Localização da estação}
