# Configuração de banco COMPARTILHADA pelo coletor e pelo servidor web (mesmo MySQL).
# Os valores vêm do arquivo .env (raiz do projeto) ou de variáveis de ambiente.
# A senha NUNCA deve ser escrita aqui: este arquivo vai para o GitHub.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:estacao_meteorologica}?serverTimezone=America/Sao_Paulo
spring.datasource.username=${MYSQL_USER:aps}
spring.datasource.password=${MYSQL_PASSWORD:}

# Hibernate
# update: cria/ajusta a tabela automaticamente durante o desenvolvimento.
# Quando o schema.sql (pasta database/) estiver aprovado, troque para "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
